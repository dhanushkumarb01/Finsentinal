<!--
  FL demo overlay, appended by demo/wazuh/wazuh.sh to a COPY of FinSentinel's wazuh_manager.conf
  (the original file is not modified). Wazuh accepts multiple <ossec_config> blocks.
-->
<ossec_config>
  <!-- FL-level events written by the demo coordinator (drift dropout, MITM refused, TLS errors). -->
  <localfile>
    <log_format>json</log_format>
    <location>/finsentinel-logs/fl-coordinator.jsonl</location>
  </localfile>

  <!-- One script, five decisions (passed as extra_args). Stateless: no timeout. -->
  <command>
    <name>fl-approve</name>
    <executable>fl-decision</executable>
    <extra_args>approve</extra_args>
    <timeout_allowed>no</timeout_allowed>
  </command>
  <command>
    <name>fl-quarantine</name>
    <executable>fl-decision</executable>
    <extra_args>quarantine</extra_args>
    <timeout_allowed>no</timeout_allowed>
  </command>
  <command>
    <name>fl-suspend</name>
    <executable>fl-decision</executable>
    <extra_args>suspend_device</extra_args>
    <timeout_allowed>no</timeout_allowed>
  </command>
  <command>
    <name>fl-reject</name>
    <executable>fl-decision</executable>
    <extra_args>reject</extra_args>
    <timeout_allowed>no</timeout_allowed>
  </command>
  <command>
    <name>fl-alert</name>
    <executable>fl-decision</executable>
    <extra_args>alert</extra_args>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- location=server: the response runs on the manager itself. -->
  <active-response>
    <command>fl-approve</command>
    <location>server</location>
    <rules_id>100201</rules_id>
  </active-response>
  <active-response>
    <command>fl-quarantine</command>
    <location>server</location>
    <rules_id>100202</rules_id>
  </active-response>
  <active-response>
    <command>fl-suspend</command>
    <location>server</location>
    <rules_id>100211</rules_id>
  </active-response>
  <active-response>
    <command>fl-reject</command>
    <location>server</location>
    <rules_id>100203,100204,100205,100206</rules_id>
  </active-response>
  <active-response>
    <command>fl-alert</command>
    <location>server</location>
    <rules_id>100212,100251,100252,100253</rules_id>
  </active-response>
</ossec_config>
